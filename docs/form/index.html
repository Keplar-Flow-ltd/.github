<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Keplar Flow - Early Adopter Program</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 60px 40px;
            text-align: center;
        }

        h1 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 40px;
            line-height: 1.8;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-family: inherit;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 40px;
            border: none;
            border-radius: 6px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .success-message {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            text-align: center;
        }

        .error-message {
            display: none;
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            text-align: center;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Register for Early Access</h1>
        <p class="subtitle">Complete this form to join the Keplar Flow Vanguard Network.</p>

        <form id="joinForm">
            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="company">Company/Organization</label>
                <input type="text" id="company" name="company">
            </div>

            <div class="form-group">
                <label for="interest">What interests you most about Keplar Flow? *</label>
                <textarea id="interest" name="interest" required></textarea>
            </div>

            <button type="submit" class="button" id="submitBtn">Register My Interest</button>
            <div class="loading" id="loadingMessage">Submitting...</div>
            <div class="success-message" id="successMessage">✓ Thank you for registering! We'll be in touch soon.</div>
            <div class="error-message" id="errorMessage">✗ Please fill in all required fields correctly.</div>
        </form>
    </div>

    <script>
        document.getElementById("joinForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const company = document.getElementById("company").value.trim();
            const interest = document.getElementById("interest").value.trim();
            const emailInput = document.getElementById("email");

            document.getElementById("successMessage").style.display = "none";
            document.getElementById("errorMessage").style.display = "none";
            document.getElementById("loadingMessage").style.display = "none";

            if (!name || !email || !interest || !emailInput.checkValidity()) {
                document.getElementById("errorMessage").style.display = "block";
                return;
            }

            document.getElementById("loadingMessage").style.display = "block";
            const submitBtn = document.getElementById("submitBtn");
            submitBtn.disabled = true;

            const formData = new FormData();
            formData.append("name", name);
            formData.append("email", email);
            formData.append("company", company);
            formData.append("interest", interest);
            formData.append("timestamp", new Date().toISOString());

            const scriptUrl = "__GOOGLE_APPS_SCRIPT_URL__";

            if (scriptUrl === "__GOOGLE_APPS_SCRIPT_URL__") {
                document.getElementById("errorMessage").textContent = "✗ Google Apps Script URL not configured. Please contact support.";
                document.getElementById("errorMessage").style.display = "block";
                document.getElementById("loadingMessage").style.display = "none";
                submitBtn.disabled = false;
                return;
            }

            fetch(scriptUrl, {
                method: "POST",
                body: formData,
                mode: "no-cors"
            })
            .then(() => {
                document.getElementById("successMessage").style.display = "block";
                document.getElementById("joinForm").reset();
            })
            .catch(() => {
                document.getElementById("errorMessage").textContent = "✗ Error submitting form. Please try again.";
                document.getElementById("errorMessage").style.display = "block";
            })
            .finally(() => {
                document.getElementById("loadingMessage").style.display = "none";
                submitBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
