name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Inject Google Form URL
        env:
          GOOGLE_FORM_URL: ${{ secrets.GOOGLE_FORM_URL }}
        run: |
          if [ -z "$GOOGLE_FORM_URL" ]; then
            echo "Warning: GOOGLE_FORM_URL secret is not set. Using placeholder."
            exit 0
          fi
          escaped_url=$(printf '%s\n' "$GOOGLE_FORM_URL" | sed -e 's/[\/&|]/\\&/g')
          sed -i "s|{{GOOGLE_FORM_URL}}|$escaped_url|g" docs/form/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


        
